spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8083}
spring.application.name=chatbot-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kidcare_chatbot}

# JWT — mismo secret que los demas servicios
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ──────────────────────────────────────────────────────────────────
# IA API — Configurado para OpenRouter (modelos económicos)
# Para volver a Claude directo ver: claudeapi.md
# ──────────────────────────────────────────────────────────────────

# URL del endpoint (OpenRouter usa formato OpenAI /chat/completions)
claude.api.url=${CLAUDE_API_URL:https://openrouter.ai/api/v1/chat/completions}

# Tu API Key de OpenRouter: https://openrouter.ai/keys
claude.api.key=${CLAUDE_API_KEY:}

# Tipo de auth: "bearer" = OpenRouter/OpenAI  |  "x-api-key" = Anthropic directo
claude.api.auth-type=${CLAUDE_API_AUTH_TYPE:bearer}

# Modelo a usar — ejemplos económicos en OpenRouter:
#   google/gemini-flash-1.5        (~$0.075/1M tokens)
#   meta-llama/llama-3-8b-instruct (gratis con límite)
#   mistralai/mistral-7b-instruct  (~$0.06/1M tokens)
claude.model=${CLAUDE_MODEL:meta-llama/llama-3-8b-instruct}

# Serialización de fechas como strings ISO (ej: "2024-03-15" no [2024,3,15])
spring.jackson.serialization.write-dates-as-timestamps=false
