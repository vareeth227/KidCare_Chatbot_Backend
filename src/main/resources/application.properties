server.port=${PORT:8083}
spring.application.name=chatbot-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/db_chatbot}

# JWT — mismo secret que los demas servicios
jwt.secret=${JWT_SECRET:kidcare-secret-key-2024-segura-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Claude API — si esta vacio, opera en modo degradado
claude.api.key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-4-6}
