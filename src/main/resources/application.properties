spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8083}
spring.application.name=chatbot-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kidcare_chatbot}

# JWT — mismo secret que los demas servicios
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ──────────────────────────────────────────────────────────────────
# IA API — Configurado para OpenAI
# Obtén tu API Key en: https://platform.openai.com/api-keys
# ──────────────────────────────────────────────────────────────────

# URL del endpoint OpenAI (formato /chat/completions)
claude.api.url=${CLAUDE_API_URL:https://api.openai.com/v1/chat/completions}

# Tu API Key de OpenAI: https://platform.openai.com/api-keys
claude.api.key=${CLAUDE_API_KEY:}

# Tipo de auth: "bearer" = OpenAI/OpenRouter  |  "x-api-key" = Anthropic directo
claude.api.auth-type=${CLAUDE_API_AUTH_TYPE:bearer}

# Modelo OpenAI a usar:
#   gpt-4o-mini   — económico, muy capaz ($0.15/1M input, $0.60/1M output)
#   gpt-4o        — más potente ($2.50/1M input)
#   gpt-3.5-turbo — más barato ($0.50/1M input)
claude.model=${CLAUDE_MODEL:gpt-4o-mini}

# Serialización de fechas como strings ISO (ej: "2024-03-15" no [2024,3,15])
spring.jackson.serialization.write-dates-as-timestamps=false
